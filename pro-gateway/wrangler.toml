name = "miaocut-pro-gateway"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 自定义域名:在 Cloudflare Dashboard 或下方 routes 绑定 pro-api.miaocut.app
routes = [
  { pattern = "pro-api.miaocut.app", custom_domain = true }
]

[[kv_namespaces]]
binding = "MIAOCUT_STATE"
id = "60a43578900044669a70f47e2cc30a6e"

[[r2_buckets]]
binding = "BATCH_BUCKET"
bucket_name = "miaocut-batch"

# -----------------------------------------------------------------------------
# 非敏感变量(明文)。敏感密钥用 `wrangler secret put`,不要写在这里。
# -----------------------------------------------------------------------------
[vars]
# CORS 允许来源(开发期可设为 "*"，生产建议精确到站点)
CORS_ALLOW_ORIGIN = "*"

# 业务参数
SIGNUP_BONUS = "100"          # 注册赠送积分(决策:注册送 100)
DAILY_FREE_QUOTA = "0"        # GPU 付费路径不设每日免费额度(免费走匿名 CPU)
MAX_SYNC_UPLOAD_MB = "25"     # 同步单图上限,安全低于 CF 100MB;更大走 R2 异步(Phase 2)
BEAM_TIMEOUT_MS = "60000"     # 转发 Beam 超时,容忍冷启动

# Beam 单图处理 Endpoint(非敏感)
BEAM_ENDPOINT = "https://miaocut-cutout-82d3943-v21.app.beam.cloud"

# 批量任务专属 endpoint
BEAM_BATCH_URL = "https://miaocut-batch-4855566-v56.app.beam.cloud"

# ---- 批量 GPU 双平台 A/B(Beam vs Modal)------------------------------------
# alternate = 按 UTC 日期奇偶轮换(偶数天 Beam / 奇数天 Modal),跑一阵子后用
#   curl -H "X-Batch-Secret: $BATCH_CALLBACK_SECRET" \
#        "https://pro-api.miaocut.app/v1/batch/platform-stats?days=14"
# 对比失败率/冷启动率/耗时。要临时钉死某一边就改成 "beam" 或 "modal"。
# 注:付费单图同步路径不参与轮换,始终走 BEAM_ENDPOINT。
# ⚠️ 当前钉死 beam:Modal 侧尚未跑通真实图片验证。
#    验证步骤:改成 "modal" → wrangler deploy → 前端跑 3~5 张 → 看 platform-stats
#    确认无误后再改回 "alternate" 正式开始 A/B。
BATCH_PLATFORM_MODE = "beam"

# Modal 批量入队端点(`modal deploy modal_app.py` 后打印的 batch-enqueue-app URL)
# 留空 = Modal 侧未就绪,轮到 Modal 的日子会自动回落到 Beam。
MODAL_BATCH_URL = "https://midcodehub--miaocut-pro-batch-enqueue-app.modal.run"
# Modal 单图端点(暂不启用:付费单图仍全量走 Beam,不拿实时链路做实验)
# MODAL_ENDPOINT = "https://midcodehub--miaocut-pro-cutoutendpoint-web.modal.run"

# R2(批量输入/输出)。endpoint/bucket 非敏感;Access Key/Secret 用 secret。
R2_ENDPOINT = "https://4a7197a1b3b4e75dfc9b4951898836af.r2.cloudflarestorage.com"
R2_BUCKET = "miaocut-batch"

# 充值成功/取消跳转
CHECKOUT_SUCCESS_URL = "https://miaocut.app/account/credits/?status=success"
CHECKOUT_CANCEL_URL = "https://miaocut.app/pricing/?status=cancel"

# Supabase 项目地址(非敏感)
SUPABASE_URL = "https://kaqlfoxselrvriulvlsm.supabase.co"

# -----------------------------------------------------------------------------
# 以下为 SECRETS,用命令写入,切勿提交明文:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put SUPABASE_JWT_SECRET
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put BEAM_TOKEN               # Beam 端点鉴权 token
#   wrangler secret put MODAL_TOKEN              # Modal 入队端点鉴权 token
#                                                # (= Modal secret 里的 MIAOCUT_MODAL_TOKEN)
#   wrangler secret put R2_ACCESS_KEY_ID         # R2 S3 API Access Key
#   wrangler secret put R2_SECRET_ACCESS_KEY     # R2 S3 API Secret
#   wrangler secret put BATCH_CALLBACK_SECRET    # 批量回调密钥(与 Beam batch task 同值)
#   wrangler secret put STRIPE_PRICE_STARTER_100 # Stripe Price ID(price_...)
#   wrangler secret put STRIPE_PRICE_CREATOR_500
#   wrangler secret put STRIPE_PRICE_SELLER_1500
#   wrangler secret put STRIPE_PRICE_STUDIO_5000
# -----------------------------------------------------------------------------

# =============================================================================
# Dev Environment (staging)
# =============================================================================
[env.dev]
# 部署到自定义的 dev 域名
routes = [
  { pattern = "dev-api.miaocut.app", custom_domain = true }
]

# 为 dev 创建一个新的 KV namespace (你需要运行 `wrangler kv:namespace create MIAOCUT_STATE --env dev`)
# 然后用生成的 id 替换下面的内容
[[env.dev.kv_namespaces]]
binding = "MIAOCUT_STATE"
id = "PUT_YOUR_DEV_KV_ID_HERE"

[[env.dev.r2_buckets]]
binding = "BATCH_BUCKET"
bucket_name = "miaocut-batch-dev"

[env.dev.vars]
CORS_ALLOW_ORIGIN = "*"
SIGNUP_BONUS = "100"
DAILY_FREE_QUOTA = "0"
MAX_SYNC_UPLOAD_MB = "25"
BEAM_TIMEOUT_MS = "60000"
BEAM_ENDPOINT = "https://miaocut-cutout-82d3943-v21.app.beam.cloud"
BEAM_BATCH_URL = "https://miaocut-batch-4855566-v56.app.beam.cloud"
BATCH_PLATFORM_MODE = "alternate"
MODAL_BATCH_URL = ""
R2_ENDPOINT = "https://4a7197a1b3b4e75dfc9b4951898836af.r2.cloudflarestorage.com"
R2_BUCKET = "miaocut-batch-dev"
CHECKOUT_SUCCESS_URL = "https://miaocut.app/account/credits/?status=success"
CHECKOUT_CANCEL_URL = "https://miaocut.app/pricing/?status=cancel"
SUPABASE_URL = "PUT_YOUR_DEV_SUPABASE_URL_HERE"

# Dev secrets are managed similarly:
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env dev
# wrangler secret put STRIPE_SECRET_KEY --env dev (USE STRIPE TEST KEYS!)
