name = "miaocut-url-proxy"
main = "src/index.js"
compatibility_date = "2024-11-01"

routes = [
  { pattern = "api2.miaocut.app", custom_domain = true }
]

# ⚠️ GATEWAY_SECRET（与 Hugging Face 后端共享、用来封死直连 *.hf.space 的密钥）不能写在这个文件里：
#    本仓库是公开的。改用 Cloudflare Secret 存放（不会出现在代码里）：
#      wrangler secret put GATEWAY_SECRET              # 生产 api2.miaocut.app
#      wrangler secret put GATEWAY_SECRET --env dev    # 测试 dev-api2.miaocut.app
#    更换步骤和顺序见 url-proxy/README.md。

# Production Environment (default)
[vars]
CORS_ALLOW_ORIGIN = "*"
CN_HOSTS = "midcodex-miao-cut.hf.space,midcodex-miao-cut2.hf.space,midcodex-miao-cut3.hf.space"
GLOBAL_HOSTS = "midcodex-miao-cut.hf.space,midcodex-miao-cut2.hf.space,midcodex-miao-cut3.hf.space"
DEFAULT_MAX_CONCURRENCY = "2"
HEDGE_DELAY_MS = "25000"
MAX_PARALLEL_REQUESTS = "2"
PER_HOST_TIMEOUT_MS = "35000"
QUEUE_POLL_INTERVAL_MS = "5000"
TOTAL_TIMEOUT_MS = "58000"

# Dev Environment (staging)
[env.dev]
# Deploy to a dev specific route if needed, or rely on worker dev URL
routes = [
  { pattern = "dev-api2.miaocut.app", custom_domain = true }
]
[env.dev.vars]
CORS_ALLOW_ORIGIN = "*"
# These point to the 3 dev spaces you will deploy
CN_HOSTS = "wu408124546-miao-cut-dev1.hf.space"
GLOBAL_HOSTS = "wu408124546-miao-cut-dev1.hf.space"
DEFAULT_MAX_CONCURRENCY = "2"
HEDGE_DELAY_MS = "25000"
MAX_PARALLEL_REQUESTS = "2"
PER_HOST_TIMEOUT_MS = "35000"
QUEUE_POLL_INTERVAL_MS = "5000"
TOTAL_TIMEOUT_MS = "58000"

# Notes:
[[ratelimits]]
name = "RATE_LIMITER"
# namespace_id 可以是任意唯一的自定义整数/数字字符串
namespace_id = "999"
simple = { limit = 10, period = 60 }
